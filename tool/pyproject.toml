[project]
name = "sop"
version = "0.1"
description = "SOP Lang tool around the VSA reader: formalize, check, diff, stats, train"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.0"]

[project.scripts]
sop = "sop.cli:main"

[tool.setuptools]
packages = ["sop"]
